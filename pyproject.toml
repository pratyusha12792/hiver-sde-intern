[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-support-agent"
version = "0.1.0"
description = "Evidence-grounded SpotifyCares support agent and evaluation harness"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.40,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyYAML>=6,<7"]

[project.scripts]
spotify-support = "spotify_support.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
